<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">BEFORE: Direct database integration</title>
  <desc id="description">Direct SAP database access. Data is read directly from the SAP HANA or non-HANA database on the left, mapped to JSON, and sent directly to an external SaaS API on the right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#829b9d" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #edf3f2; }
      .muted { fill: #a8bab9; }
      .node { fill: #172224; stroke: #364d4e; stroke-width: 1.5; }
      .wire { fill: none; stroke: #829b9d; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#0e181a"/>
  <text x="64" y="68" font-size="20" style="fill:#d3ad72">BEFORE</text>
  <text x="64" y="134" font-size="44">Direct database integration</text>
  <text x="64" y="180" font-size="24" class="muted">Direct SAP database access</text>

  <rect x="64" y="306" width="288" height="148" rx="12" class="node"/>
  <text x="208" y="372" text-anchor="middle" font-size="32">SAP database</text>
  <text x="208" y="414" text-anchor="middle" font-size="24" class="muted">HANA / non-HANA</text>
  <path d="M352 380 H496" class="wire" marker-end="url(#arrow)"/>
  <text x="424" y="364" text-anchor="middle" font-size="20" class="muted">Direct read</text>

  <rect x="496" y="306" width="288" height="148" rx="12" class="node"/>
  <text x="640" y="391" text-anchor="middle" font-size="32">JSON mapping</text>
  <path d="M784 380 H928" class="wire" marker-end="url(#arrow)"/>
  <text x="856" y="364" text-anchor="middle" font-size="20" class="muted">Send JSON</text>

  <rect x="928" y="306" width="288" height="148" rx="12" class="node"/>
  <text x="1072" y="372" text-anchor="middle" font-size="32">External SaaS</text>
  <text x="1072" y="414" text-anchor="middle" font-size="24" class="muted">API</text>
</svg>
